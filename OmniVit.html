<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROVISION1 | The Forensic Utility Architecture</title>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-color: #1a1a1a;
            --forest: #355E3B;
            --brass: #A88A3A;
            --muted-text: #666666;
            --mono-font: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', monospace;
            --sans-font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--sans-font);
            line-height: 1.6;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .doc-meta {
            font-family: var(--mono-font);
            font-size: 0.75rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--brass);
            padding-bottom: 0.5rem;
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            color: var(--muted-text);
            font-weight: 600;
        }

        header { margin-bottom: 3rem; }
        h1 { font-family: var(--mono-font); font-size: 2.4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 0.5rem; text-transform: uppercase; color: var(--forest); }
        .tagline { font-family: var(--mono-font); font-size: 0.95rem; color: var(--forest); margin-bottom: 2.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
        
        .image-container {
            margin: 3rem 0;
            text-align: center;
            background: #111111;
            padding: 1rem;
            border: 1px solid var(--forest);
        }

        .image-container img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
        }

        .footer-wall { border-top: 4px solid var(--forest); padding: 3rem 0; margin-top: 6rem; font-family: var(--mono-font); font-size: 0.8rem; background: #000; color: #fff; padding: 30px; }
    </style>
</head>
<body>

    <div class="doc-meta">
        <span>PROVISION1</span>
        <span>SYSTEMS ENGINEERING DIVISION</span>
    </div>

    <header>
        <a href="index.html" style="text-decoration: none; color: inherit;">
            <h1>PROVISION1 LABORATORY</h1>
        </a>
        <p class="tagline">Engineering systems that preserve, structure, and operationalize complex knowledge and media.</p>
    </header>

    <main class="image-container">
        <img src="Omnibus Vitrifier.png" alt="Provision1 - The Forensic Utility Architecture Map">
    </main>

    <div class="footer-wall">
        PROVISION1 LABORATORY<br>
        SYSTEMS ENGINEERING DIVISION<br><br>
        HARDENING THE FUTURE. RECOVERING THE PAST.<br>
        ONE UNIVERSAL SIGNAL.
    </div>

</body>
</html>
